<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YNS Hesap Makinesi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
        }

        /* Glassmorphism Effect */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Button Glow & Active Press Effects */
        .calc-btn {
            transition: all 0.15s ease-in-out;
            position: relative;
            overflow: hidden;
        }
        .calc-btn:active {
            transform: scale(0.92);
        }
        
        /* Ripple effect container */
        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-effect 0.4s linear;
            pointer-events: none;
        }

        @keyframes ripple-effect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Custom Scrollbar for History */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 selection:bg-purple-500 selection:text-white">

    <div class="w-full max-w-md glass-panel rounded-3xl p-6 text-white flex flex-col justify-between relative overflow-hidden">
        
        <!-- Background Ambient Glow Accents -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-purple-600/30 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-indigo-600/30 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header / Brand -->
        <div class="flex items-center justify-between mb-6 z-10">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-purple-500 to-indigo-500 flex items-center justify-center font-bold text-sm shadow-lg shadow-purple-500/30">
                    Y
                </div>
                <h1 class="font-bold text-lg tracking-wider bg-gradient-to-r from-white via-slate-200 to-purple-300 bg-clip-text text-transparent">YNS</h1>
            </div>
            <!-- History Toggle Button -->
            <button id="history-toggle" class="p-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/5 transition-all text-slate-300 hover:text-white flex items-center space-x-1 text-xs font-medium">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>Geçmiş</span>
            </button>
        </div>

        <!-- Display Screen -->
        <div class="mb-6 z-10 bg-black/20 rounded-2xl p-4 border border-white/5 flex flex-col justify-end text-right min-h-[110px] relative shadow-inner">
            <div id="history-expr" class="text-slate-400 text-sm h-6 overflow-x-auto whitespace-nowrap tracking-wide font-light"></div>
            <div id="main-display" class="text-4xl sm:text-5xl font-semibold tracking-tight text-white overflow-x-auto whitespace-nowrap mt-1">0</div>
        </div>

        <!-- Calculator Keypad Grid -->
        <div class="grid grid-cols-4 gap-3 z-10">
            <!-- Row 1 -->
            <button onclick="clearAll()" class="calc-btn col-span-1 py-3.5 rounded-2xl bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 font-semibold border border-rose-500/20 shadow-lg">AC</button>
            <button onclick="deleteDigit()" class="calc-btn col-span-1 py-3.5 rounded-2xl bg-white/5 hover:bg-white/10 text-slate-300 font-semibold border border-white/5">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414-6.414a2 2 0 011.414-.586H19a2 2 0 012 2v12a2 2 0 01-2 2h-8.172a2 2 0 01-1.414-.586L3 12z" />
                </svg>
            </button>
            <button onclick="appendOperator('%')" class="calc-btn py-3.5 rounded-2xl bg-white/5 hover:bg-white/10 text-purple-300 font-semibold border border-white/5">%</button>
            <button onclick="appendOperator('/')" class="calc-btn py-3.5 rounded-2xl bg-purple-600/20 hover:bg-purple-600/30 text-purple-300 font-semibold border border-purple-500/20">÷</button>

            <!-- Row 2 -->
            <button onclick="appendNumber('7')" class="calc-btn py-3.5 rounded-2xl bg-white/10 hover:bg-white/15 text-white font-medium border border-white/5">7</button>
            <button onclick="appendNumber('8')" class="calc-btn py-3.5 rounded-2xl bg-white/10 hover:bg-white/15 text-white font-medium border border-white/5">8</button>
            <button onclick="appendNumber('9')" class="calc-btn py-3.5 rounded-2xl bg-white/10 hover:bg-white/15 text-white font-medium border border-white/5">9</button>
            <button onclick="appendOperator('*')" class="calc-btn py-3.5 rounded-2xl bg-purple-600/20 hover:bg-purple-600/30 text-purple-300 font-semibold border border-purple-500/20">×</button>

            <!-- Row 3 -->
            <button onclick="appendNumber('4')" class="calc-btn py-3.5 rounded-2xl bg-white/10 hover:bg-white/15 text-white font-medium border border-white/5">4</button>
            <button onclick="appendNumber('5')" class="calc-btn py-3.5 rounded-2xl bg-white/10 hover:bg-white/15 text-white font-medium border border-white/5">5</button>
            <button onclick="appendNumber('6')" class="calc-btn py-3.5 rounded-2xl bg-white/10 hover:bg-white/15 text-white font-medium border border-white/5">6</button>
            <button onclick="appendOperator('-')" class="calc-btn py-3.5 rounded-2xl bg-purple-600/20 hover:bg-purple-600/30 text-purple-300 font-semibold border border-purple-500/20">-</button>

            <!-- Row 4 -->
            <button onclick="appendNumber('1')" class="calc-btn py-3.5 rounded-2xl bg-white/10 hover:bg-white/15 text-white font-medium border border-white/5">1</button>
            <button onclick="appendNumber('2')" class="calc-btn py-3.5 rounded-2xl bg-white/10 hover:bg-white/15 text-white font-medium border border-white/5">2</button>
            <button onclick="appendNumber('3')" class="calc-btn py-3.5 rounded-2xl bg-white/10 hover:bg-white/15 text-white font-medium border border-white/5">3</button>
            <button onclick="appendOperator('+')" class="calc-btn py-3.5 rounded-2xl bg-purple-600/20 hover:bg-purple-600/30 text-purple-300 font-semibold border border-purple-500/20">+</button>

            <!-- Row 5 -->
            <button onclick="appendNumber('0')" class="calc-btn col-span-2 py-3.5 rounded-2xl bg-white/10 hover:bg-white/15 text-white font-medium border border-white/5 text-left pl-6">0</button>
            <button onclick="appendDecimal('.')" class="calc-btn py-3.5 rounded-2xl bg-white/10 hover:bg-white/15 text-white font-medium border border-white/5">.</button>
            <button onclick="calculateResult()" class="calc-btn py-3.5 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold shadow-lg shadow-purple-600/40 border border-purple-400/30">=</button>
        </div>

        <!-- Custom Notification/Message Box -->
        <div id="custom-msg" class="hidden absolute inset-x-6 top-1/2 -translate-y-1/2 bg-slate-900/95 border border-purple-500/30 p-4 rounded-2xl text-center shadow-2xl backdrop-blur-md z-30 transition-all duration-300">
            <p id="msg-text" class="text-sm font-medium text-slate-200 mb-3"></p>
            <button onclick="closeMsg()" class="px-4 py-1.5 bg-purple-600 hover:bg-purple-500 text-white rounded-xl text-xs font-semibold shadow-md">Tamam</button>
        </div>

        <!-- History Sidebar/Overlay Panel -->
        <div id="history-panel" class="absolute inset-0 bg-slate-950/90 backdrop-blur-xl p-6 rounded-3xl z-20 flex flex-col transform translate-y-full transition-transform duration-300 ease-in-out">
            <div class="flex items-center justify-between mb-4 border-b border-white/10 pb-3">
                <h2 class="font-bold text-sm tracking-wide text-purple-300 uppercase">İşlem Geçmişi</h2>
                <button onclick="toggleHistory()" class="p-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div id="history-list" class="flex-1 overflow-y-auto space-y-2 pr-1 text-sm text-slate-300">
                <p class="text-slate-500 text-center py-10 font-light">Henüz işlem geçmişi yok.</p>
            </div>
            <button onclick="clearHistory()" class="mt-4 py-2 w-full bg-rose-500/20 hover:bg-rose-500/30 border border-rose-500/20 text-rose-300 rounded-xl text-xs font-semibold transition-all">Geçmişi Temizle</button>
        </div>

        <!-- Footer watermark -->
        <div class="mt-5 text-center z-10">
            <span class="text-[10px] tracking-widest text-slate-500 font-medium uppercase">YNS DESIGN SYSTEM &bull; 2026</span>
        </div>
    </div>

    <script>
        let currentInput = '0';
        let expression = '';
        let historyArray = [];
        let isResultDisplayed = false;

        const mainDisplay = document.getElementById('main-display');
        const historyExpr = document.getElementById('history-expr');
        const historyPanel = document.getElementById('history-panel');
        const historyList = document.getElementById('history-list');

        // Add ripple animation effect on buttons
        document.querySelectorAll('.calc-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const rect = this.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const ripple = document.createElement('span');
                ripple.classList.add('ripple');
                ripple.style.left = `${x}px`;
                ripple.style.top = `${y}px`;
                
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 400);
            });
        });

        // Toggle History Panel
        document.getElementById('history-toggle').addEventListener('click', toggleHistory);

        function toggleHistory() {
            historyPanel.classList.toggle('translate-y-full');
        }

        // Custom Message Box alternative to alert()
        function showMessage(text) {
            const msgBox = document.getElementById('custom-msg');
            const msgText = document.getElementById('msg-text');
            msgText.innerText = text;
            msgBox.classList.remove('hidden');
        }

        function closeMsg() {
            document.getElementById('custom-msg').classList.add('hidden');
        }

        // Append Number
        function appendNumber(num) {
            if (isResultDisplayed) {
                currentInput = num;
                isResultDisplayed = false;
            } else {
                if (currentInput === '0') {
                    currentInput = num;
                } else {
                    currentInput += num;
                }
            }
            updateDisplay();
        }

        // Append Operator (+, -, *, /, %)
        function appendOperator(op) {
            if (isResultDisplayed) {
                expression = mainDisplay.innerText + ' ' + op + ' ';
                isResultDisplayed = false;
            } else {
                expression += currentInput + ' ' + op + ' ';
            }
            currentInput = '0';
            updateDisplay();
        }

        // Append Decimal Separator
        function appendDecimal(dot) {
            if (isResultDisplayed) {
                currentInput = '0.';
                isResultDisplayed = false;
            } else if (!currentInput.includes('.')) {
                currentInput += dot;
            }
            updateDisplay();
        }

        // Clear All
        function clearAll() {
            currentInput = '0';
            expression = '';
            isResultDisplayed = false;
            updateDisplay();
        }

        // Delete Last Digit
        function deleteDigit() {
            if (isResultDisplayed) return;
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        // Update Screen UI
        function updateDisplay() {
            mainDisplay.innerText = currentInput;
            historyExpr.innerText = expression;
        }

        // Calculate Result safely
        function calculateResult() {
            if (isResultDisplayed) return;
            
            let fullExpression = expression + currentInput;
            // Replace visual symbols with javascript evaluable operators
            let evalString = fullExpression.replace(/×/g, '*').replace(/÷/g, '/');

            try {
                // Handling percentages calculation helpers safely
                evalString = evalString.replace(/(\d+(\.\d+)?)%/g, '($1/100)');

                let result = eval(evalString);
                
                // Format floating numbers cleanly
                if (!Number.isInteger(result)) {
                    result = parseFloat(result.toFixed(8));
                }

                // Add to history
                addToHistory(fullExpression, result);

                expression = fullExpression + ' =';
                currentInput = result.toString();
                isResultDisplayed = true;
                updateDisplay();
            } catch (error) {
                showMessage('Geçersiz işlem veya ifade!');
                clearAll();
            }
        }

        // History Management
        function addToHistory(expr, res) {
            historyArray.unshift({ expr, res });
            if (historyArray.length > 20) historyArray.pop();
            renderHistory();
        }

        function renderHistory() {
            if (historyArray.length === 0) {
                historyList.innerHTML = '<p class="text-slate-500 text-center py-10 font-light">Henüz işlem geçmişi yok.</p>';
                return;
            }
            
            historyList.innerHTML = historyArray.map(item => `
                <div class="bg-white/5 p-3 rounded-xl border border-white/5 flex flex-col">
                    <span class="text-xs text-slate-400">${item.expr}</span>
                    <span class="text-base font-semibold text-purple-300 text-right">= ${item.res}</span>
                </div>
            `).join('');
        }

        function clearHistory() {
            historyArray = [];
            renderHistory();
        }

        // Keyboard Support for convenience
        window.addEventListener('keydown', (e) => {
            if ((e.key >= '0' && e.key <= '9')) {
                appendNumber(e.key);
            } else if (e.key === '.') {
                appendDecimal('.');
            } else if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') {
                appendOperator(e.key);
            } else if (e.key === 'Enter' || e.key === '=') {
                calculateResult();
            } else if (e.key === 'Backspace') {
                deleteDigit();
            } else if (e.key === 'Escape') {
                clearAll();
            }
        });
    </script>
</body>
</html>
